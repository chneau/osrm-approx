[project]
name = "testing-ml-tte"
version = "1.0.0"
description = "Offline OSRM dataset generation, LightGBM training and ONNX export for the Greater Manchester routing approximation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "scikit-learn>=1.5",
]

[tool.uv]
package = false
